name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Windows is the dev platform and the one that breaks first (same-dir
      # atomic rename, path containment, shelling out to git), so a failure
      # there must not hide the Linux result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # vitest transpiles without typechecking, so the typecheck has to happen
      # somewhere. `npm run build` is `tsc -p` per workspace: it typechecks
      # every package's src — what the old step-per-package `--noEmit` block
      # did, minus the standing requirement to remember to add one — and emits
      # the dist/ the rmmz-mcp bin loads, which the tests never exercise
      # because they resolve @rmmz-kit/* through the rmmz-kit-source condition.
      - run: npm run build
      - run: npx vitest run
