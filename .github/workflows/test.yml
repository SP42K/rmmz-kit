name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsc -p packages/core/tsconfig.json --noEmit
      # vitest transpiles without typechecking, so every package needs its own
      # tsc run here or its type errors reach main unnoticed.
      - run: npx tsc -p packages/compiler/tsconfig.json --noEmit
      - run: npx vitest run
